[project]
name = "fulcrum"
version = "0.2.0"
description = "Optimal per-region DP noise allocation for hierarchical federated learning"
authors = [
    { name = "Murtaza Rangwala", email = "rangwalam@unimelb.edu.au" },
]
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # Core ML
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # Frozen-backbone fine-tuning experiments (probe.py / agnews.py)
    "sentence-transformers>=3.0",
    "datasets>=2.19",
    # Data and analysis
    "pandas>=2.1",
    "pyarrow>=14",  # parquet
    # Plotting
    "matplotlib>=3.7",
]

# NOTE (v0.2.0): the v1 dependency set is gone along with the v1 pipeline.
#   - opacus       : v2 uses SILO-level DP (clip the client update, add Gaussian noise
#                    directly), which needs no per-sample gradient machinery.
#   - lightgbm     : was the TADI attack regressor; TADI is not part of v2.
#   - murmura, flamby, albumentations, scikit-image, qudida, opencv,
#     efficientnet_pytorch : belonged to the FLamby cross-silo settings, which v2
#                    replaces with frozen-backbone fine-tuning benchmarks.
#   - click, pyyaml, networkx, seaborn : CLI/config/plot stack of the removed pipeline.

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fulcrum"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = ["E501"]
