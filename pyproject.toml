[project]
name = "fulcrum"
version = "0.1.0"
description = "Network Structures as an Attack Surface — topology-conditional distribution inference and topology-aware DP allocation in federated learning"
authors = [
    { name = "Murtaza Rangwala", email = "rangwalam@unimelb.edu.au" },
]
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # Core ML
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # Differential privacy
    "opacus>=1.4",
    # Federated learning framework
    "murmura @ git+https://github.com/Cloudslab/murmura.git",
    # Attack regressors
    "lightgbm>=4.0",
    # Data and analysis
    "pandas>=2.1",
    "pyarrow>=14",  # parquet
    # Configs and CLI
    "pyyaml>=6.0",
    "click>=8.1",
    # Plotting
    "matplotlib>=3.7",
    "seaborn>=0.13",
    # Networks
    "networkx>=3.1",
]

[project.optional-dependencies]
flamby = [
    # FLamby is installed from source; see scripts/setup_env.sh
]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[project.scripts]
fulcrum = "fulcrum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fulcrum"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = ["E501"]
