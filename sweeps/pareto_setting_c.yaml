# Setting C Pareto frontier — CIFAR-10 synthetic with η=0.5 fixed.
#
# Same structure as A and B sweeps (108 runs). η is fixed at 0.5 so we get
# a single Pareto curve at moderate coupling; the η-sweep (separate spec)
# explores how the gap between topology-aware and uniform varies with η.

base: configs/setting_c_canonical.yaml
output_dir: runs
db_path: experiments.db

sweep:
  dp.utility_budget_U: [0.05, 0.1, 0.2, 0.4, 0.8, 1.6]
  dp.observation_window: [25, 50, 100]
  dp.allocation: [topology_aware, uniform]
  experiment.seed: [0, 1, 2]
