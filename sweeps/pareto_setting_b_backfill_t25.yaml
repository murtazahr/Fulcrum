# Setting B Pareto backfill at T_max = 25.
#
# The original Setting B Pareto sweep (sweeps/pareto_setting_b.yaml)
# covered T_max ∈ {20, 50, 100}. A later partial sweep populated three
# U cells at T_max = 25 (U ∈ {0.05, 0.2, 0.8}) but missed the three
# remaining cells (U ∈ {0.025, 0.1, 0.4}), leaving the T_max = 25 row
# of the utility table at n = 9 instead of n = 18 and the figure panel
# with sparse coverage.
#
# This sweep fills in the missing cells. The factorial runner
# deduplicates on the run-config hash, so listing the full U grid is
# safe: only the three previously unrun cells generate new work.
#
# Total: 6 U × 1 T_max × 2 allocations × 3 seeds = 36 runs nominally,
# of which 18 are dedup-skipped → 18 actually run (~20 min on
# Fed-Heart-Disease's small MLP).

base: configs/setting_b_canonical.yaml
output_dir: runs
db_path: experiments.db

sweep:
  dp.utility_budget_U: [0.025, 0.05, 0.1, 0.2, 0.4, 0.8]
  dp.observation_window: [25]
  dp.allocation: [topology_aware, uniform]
  experiment.seed: [0, 1, 2]
