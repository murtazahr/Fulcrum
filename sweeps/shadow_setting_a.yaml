# Setting A shadow training data — TADI adversary's offline training corpus.
#
# Generates labeled (features, p_i) pairs via synthetic re-partitioning of
# Fed-ISIC2019 across 6 clients (matching the target sweep's site count).
# The re-partitioning ignores native FLamby site assignments and applies
# Dirichlet(α) per shadow run, varying α across runs so that the regressor
# sees a diverse distribution of (Θ_i, p_i) pairs.
#
# Shadow runs have NO DP (clean leakage signal) and use seeds disjoint
# from the target sweep (10..19) to avoid leak-through.
#
# Total: 5 alphas × 10 seeds × 1 allocation = 50 shadow runs.
# Each Setting A run is much slower than Setting B (CNN on dermoscopy
# vs. tabular logistic): expect ~10-15 hr wall-clock on L40S for the
# full sweep. Run only after `data/fed_isic2019/` is preprocessed and
# the Setting A target Pareto sweep is at least partially done so that
# the cached pooled-dataset extraction is amortised.

base: configs/setting_a_canonical.yaml
output_dir: runs
db_path: experiments.db

# Same methodological change as shadow_setting_b: shadow runs apply DP
# at matching levels so parameter-trajectory features come from the
# same distribution as the target Pareto sweep. Without this, the
# regressor can't transfer features from no-DP shadow training to
# DP-perturbed target evaluation (see commit log for the v1 negative-
# lift diagnosis on Setting B).
sweep:
  experiment.mode: [shadow]
  experiment.seed: [10, 11, 12]
  data.synthetic_partition: [true]
  data.n_clients: [6]                       # match target site count
  data.alpha: [0.1, 0.3, 1.0, 3.0]
  data.eta: [0.0]
  dp.enabled: [true]
  dp.allocation: [topology_aware, uniform]
  dp.utility_budget_U: [0.05, 0.2, 0.8]
  dp.observation_window: [25, 100]
# Total: 4 alphas × 3 seeds × 3 U × 2 T_max × 2 allocations = 144 runs.
# At ~21 min/run on L40S = ~50 hr. This is the cost of methodologically
# correct shadow training — to be run after the Setting A Pareto sweep
# finishes. Setting B's smaller sweep (~5 hr) is the validation step.
