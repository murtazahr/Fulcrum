# Setting C η-sweep — Erdős–Rényi G(n, p) topologies (Layer 1).
#
# Extends the topology coverage of eta_sweep_setting_c.yaml beyond the
# four deterministic topologies (ring, line, hierarchical, star) into
# the stochastic-degree regime. ER graphs are the standard random-graph
# baseline for DFL evaluations and match the synthetic topology set
# used by Feng et al. 2025 (arXiv:2501.03119), enabling direct
# comparability of leverage profiles across topology families.
#
# We sweep three connection probabilities (p ∈ {0.3, 0.5, 0.7}) at
# n=50. At n=50:
#   p=0.3 → mean degree ~14.7  (sparse but well-connected)
#   p=0.5 → mean degree ~24.5  (dense)
#   p=0.7 → mean degree ~34.3  (nearly complete)
# Degree variance shrinks as p grows; the η-sweep tests how the
# topology-aware allocation behaves across this stochastic-leverage
# gradient.
#
# `topology.params: [{p: ..., seed: ...}]` form replaces the canonical
# topology.params (which carried `region_sizes` from the hierarchical
# base) — this avoids the unused-key noise observed in earlier runs
# and keeps the run config hashes clean.
#
# The topology random seed is FIXED (12345) across experiment.seed values
# so that the topology itself is a deployment constant; only Dirichlet
# draws and DP noise vary across the three replicates.
#
# Total: 3 p values × 5 etas × 2 allocations × 3 seeds = 90 runs
# (~7.5 hr at L40S, ~5 min/run on Setting C's small CNN).

base: configs/setting_c_canonical.yaml
output_dir: runs
db_path: experiments.db

sweep:
  topology.type: [erdos]
  topology.params:
    - {p: 0.3, seed: 12345}
    - {p: 0.5, seed: 12345}
    - {p: 0.7, seed: 12345}
  data.eta: [1.0, 0.75, 0.5, 0.25, 0.0]
  dp.allocation: [topology_aware, uniform]
  experiment.seed: [0, 1, 2]
