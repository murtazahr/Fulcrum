# Setting C η-sweep — Barabási–Albert preferential-attachment (Layer 2).
#
# Adds a power-law degree distribution to the topology set: high-degree
# hubs concentrate connectivity while a long tail of low-degree leaves
# carries most of the nodes. This is the canonical model for
# organically grown peer-to-peer networks and a strong stress test for
# leverage-based allocation because degree heterogeneity is extreme
# (hub deg >20 vs leaf deg = m on 50-node BA).
#
# Two attachment values:
#   m = 2 → sparse BA; long power-law tail; classic "preferential
#            attachment" topology used in network-science benchmarks
#   m = 4 → denser BA; reduces hub dominance but preserves the
#            power-law character; closer to deployed P2P networks
#
# The topology random seed is FIXED (12345) across experiment.seed values
# so that the topology itself is a deployment constant; only Dirichlet
# draws and DP noise vary across the three replicates.
#
# Total: 2 m values × 5 etas × 2 allocations × 3 seeds = 60 runs
# (~5 hr at L40S).

base: configs/setting_c_canonical.yaml
output_dir: runs
db_path: experiments.db

sweep:
  topology.type: [barabasi_albert]
  topology.params:
    - {m: 2, seed: 12345}
    - {m: 4, seed: 12345}
  data.eta: [1.0, 0.75, 0.5, 0.25, 0.0]
  dp.allocation: [topology_aware, uniform]
  experiment.seed: [0, 1, 2]
