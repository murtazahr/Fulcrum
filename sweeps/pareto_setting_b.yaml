# Setting B Pareto frontier — Fed-Heart-Disease decentralized FL.
#
# Same structure as Setting A's sweep (108 runs), but with smaller budgets
# matching the smaller model and dataset. T_max values trimmed since
# Fed-Heart-Disease converges in ~50 rounds.

base: configs/setting_b_canonical.yaml
output_dir: runs
db_path: experiments.db

sweep:
  dp.utility_budget_U: [0.025, 0.05, 0.1, 0.2, 0.4, 0.8]
  dp.observation_window: [20, 50, 100]
  dp.allocation: [topology_aware, uniform]
  experiment.seed: [0, 1, 2]
