# Setting A — canonical Fed-ISIC2019 hierarchical FL configuration
#
# 6 sites partitioned across 3 regional aggregators (2 sites each).
# Topology-aware DP allocation with leverage = dataset-size (FedAvg-influence heuristic).
# Native FLamby site sizes [9930, 3163, 2691, 1807, 655, 351] →
# leverage [3.20, 1.02, 0.87, 0.58, 0.21, 0.11] — strong asymmetry (29× ratio)
# from real cross-silo heterogeneity, ensuring Theorem 2 doesn't degenerate.
# 'group_size' was the original choice but with [2,2,2] balanced regions it
# gave uniform leverage; we keep group_size in the proxy library for SBM
# benchmarks where group sizes vary.
# Used as the realism anchor for the manuscript (see Redesign/02_threat_model_partitioning.md §2.6).

setting: A

experiment:
  name: setting_a_canonical
  seed: 0
  mode: target
  output_dir: runs

data:
  data_root: data
  sensitive_class: 0          # melanoma

topology:
  type: hierarchical
  num_regions: 3              # → omega = [0,0,1,1,2,2] for 6 sites

training:
  rounds: 100
  local_epochs: 1
  batch_size: 32
  learning_rate: 0.01

dp:
  enabled: true
  allocation: topology_aware  # comparator: rerun with allocation=uniform
  utility_budget_U: 0.6       # sum_i sigma_i^2 budget
  observation_window: 100     # T_max (D3)
  max_grad_norm: 1.0          # C
  delta: 1.0e-5

leverage:
  proxy: dataset_size         # See top-of-file comment.
                              # 'group_size' would degenerate at [2,2,2] balanced regions.

attack:
  enabled: true
  channels: [A1, A2_topo, A2_org, A2_full]
  regressor: lightgbm
