# Setting C — canonical CIFAR-10 synthetic with η coupling
#
# 50 clients on a hierarchical topology with imbalanced regions
# [20, 15, 10, 3, 2], Dirichlet(α=0.5) heterogeneity, η=0.5 coupling.
#
# Topology choice rationale (see docs/decisions_log.md): we need
# asymmetric leverage across clients for Theorem 2 to differentiate
# topology-aware from uniform allocation. Imbalanced hierarchical gives
# strong, defensible asymmetry — degree varies from 19 (large region) to
# 1 (smallest region), producing an expected ~0.3-nat Pareto gap at
# η=0.5 and ~0.7-nat gap at η=1.
#
# Setting C is the statistical vehicle for headline claims; the
# realism story comes from Setting A (Fed-ISIC2019 native sites).

setting: C

experiment:
  name: setting_c_canonical
  seed: 0
  mode: target
  output_dir: runs

data:
  data_root: data
  n_clients: 50
  eta: 0.5                    # IID at 0, position-determined at 1
  alpha: 0.5                  # Dirichlet concentration
  sensitive_class: 0          # rare-class proxy

topology:
  type: hierarchical
  num_nodes: 50
  params:
    region_sizes: [20, 15, 10, 3, 2]   # imbalanced → non-uniform leverage

training:
  rounds: 100
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.01

dp:
  enabled: true
  allocation: topology_aware
  utility_budget_U: 0.5
  observation_window: 100
  max_grad_norm: 1.0
  delta: 1.0e-5

leverage:
  proxy: eta_position         # function of η × topology degrees

attack:
  enabled: true
  channels: [A1, A2_topo, A2_org, A2_full]
  regressor: lightgbm
