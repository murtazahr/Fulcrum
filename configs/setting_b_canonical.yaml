# Setting B — canonical Fed-Heart-Disease decentralized FL configuration
#
# 4 sites in a peer-to-peer ring (k-NN proximity at n=4 reduces to ring).
# Binary classification (positive heart disease as sensitive class).
# Topology-aware allocation with leverage = dataset-size (FedAvg-influence heuristic).
# Native FLamby site sizes [199, 172, 30, 85] → leverage [1.64, 1.42, 0.25, 0.70],
# producing genuine asymmetry from real data heterogeneity even on a symmetric ring.
# 'degree' was the original choice but degenerates to uniform (all degrees = 2).
# Forward-looking deployment scenario; see Redesign/02_threat_model_partitioning.md §2.6.

setting: B

experiment:
  name: setting_b_canonical
  seed: 0
  mode: target
  output_dir: runs

data:
  data_root: data
  sensitive_class: 1          # positive heart disease

topology:
  type: ring                  # 4-node ring; degenerate but matches k-NN at n=4
  num_nodes: 4

training:
  rounds: 100
  local_epochs: 1
  batch_size: 16              # smaller batch — Fed-Heart-Disease is tiny (~200/site)
  learning_rate: 0.05

dp:
  enabled: true
  allocation: topology_aware
  utility_budget_U: 0.4
  observation_window: 100
  max_grad_norm: 1.0
  delta: 1.0e-5

leverage:
  proxy: dataset_size         # See top-of-file comment.
                              # 'degree' would degenerate (4-node ring → all degrees = 2).

attack:
  enabled: true
  channels: [A1, A2_topo, A2_org, A2_full]
  regressor: lightgbm
